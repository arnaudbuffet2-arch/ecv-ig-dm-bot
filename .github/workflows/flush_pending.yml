name: Flush pending_follow (one-off)

on:
  workflow_dispatch:

concurrency:
  group: ig-dm-bot
  cancel-in-progress: false

jobs:
  flush:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Flush pending_follow
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python flush_pending_follow.py

      - name: Save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add instagram_dm_bot_state.json
          git diff --cached --quiet || git commit -m "chore: flush pending_follow to sent_msg2"
          git pull --rebase origin main
          git push
