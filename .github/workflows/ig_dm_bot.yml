name: Instagram DM Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # toutes les 5 minutes
  workflow_dispatch:          # declenchement manuel possible

concurrency:
  group: ig-dm-bot
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        id: run_bot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python instagram_dm_bot.py

      - name: Update token secret if refreshed
        if: steps.run_bot.outputs.new_token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_IG_TOKEN: ${{ steps.run_bot.outputs.new_token }}
        run: printf '%s' "$NEW_IG_TOKEN" | gh secret set IG_ACCESS_TOKEN --repo ${{ github.repository }}

      - name: Save state
        if: always()
        run: |
          cp instagram_dm_bot_state.json /tmp/local_new_state.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python merge_state.py /tmp/local_new_state.json